<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VANGUARD MD Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="logo">🤖</div>
    <h1>VANGUARD MD</h1>
    <p>Self-Service Pairing</p>

    <input type="text" id="token" placeholder="Enter your token (vg_...)" required autocomplete="off">
    <button id="checkBtn" onclick="checkToken()">🔍 Check Token</button>

    <div id="statusMessage" class="status hidden"></div>

    <div id="pairSection" class="hidden">
      <!-- Mode toggle -->
      <div class="toggle">
        <div class="toggle-option active" id="togglePhone" onclick="setPairMode('phone')">🔑 Pair Code</div>
        <div class="toggle-option" id="toggleQr" onclick="setPairMode('qr')">📱 QR Code</div>
      </div>

      <!-- Phone flow -->
      <div id="phoneBlock">
        <input type="text" id="phone" placeholder="Enter phone (256745626308)" autocomplete="off">
        <button id="pairBtn" onclick="requestPair()">🔑 Pair Now</button>
        <div id="pairResult"></div>
      </div>

      <!-- QR flow -->
      <div id="qrBlock" class="hidden">
        <button id="qrGenBtn" onclick="requestPairQr()">📱 Generate QR Code</button>
        <div id="qrBox" class="qr-box hidden">
          <img id="qrImage" src="" alt="QR Code">
          <small>
            Open WhatsApp → Linked Devices → <b>Link a Device</b><br>
            Scan the QR above. Refreshes automatically.
          </small>
        </div>
      </div>
    </div>

    <div id="loader" class="loader hidden">
      <div class="spinner"></div>
      <strong id="loaderText">Requesting...</strong>
    </div>
  </div>

  <footer>
    © 2026 Mr.Admin Blue | VANGUARD MD<br>
    All rights reserved 🔥
  </footer>

  <script src="script.js"></script>
</body>
</html>
